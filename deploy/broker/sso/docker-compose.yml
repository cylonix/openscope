# OpenScope broker — SSO reference + smoke stack.
#
# Proves the enterprise human-auth chain end to end, with no real IdP:
#
#   client (IdP JWT) -> oauth2-proxy -> nginx -> openscoped -> sshd target
#                       │ validates    │ swaps  │ trusts
#                       │ OIDC JWT,    │ Authz  │ X-Forwarded-Email
#                       │ forwards     │ to the │ ONLY for a trusted-proxy
#                       │ X-Forwarded- │ broker │ token, runs the SSH verb,
#                       │ Email        │ proxy  │ audits the human
#                                       token
#
# oauth2-proxy is the IdP-agnostic integration point: swap its provider flags
# for Okta/Entra/Google/Auth0 and nothing else changes. mock-oauth2-server
# stands in for the customer IdP so the chain runs headlessly in CI.
#
# Driven by scripts/smoke_broker_sso.sh — not meant to be `up`'d by hand
# (the proxy tier needs a broker-minted token rendered into nginx.conf first).
name: openscope-sso-smoke

services:
  # --- Customer IdP stand-in (issues signed OIDC JWTs headlessly) -----------
  mock-oidc:
    image: ghcr.io/navikt/mock-oauth2-server:2.1.10
    networks: [ssonet]

  # --- The privileged resource the broker reaches over SSH -----------------
  target:
    image: lscr.io/linuxserver/openssh-server:latest
    environment:
      - USER_NAME=broker
      - PUBLIC_KEY_FILE=/seed/broker_key.pub
      - PASSWORD_ACCESS=false
      - PUID=1000
      - PGID=1000
    volumes:
      - ./.smoke/seed:/seed:ro
    networks: [ssonet]

  # --- The OpenScope broker (holds the SSH key, evaluates policy) -----------
  # Runs as root: the SSH executor refuses keys that are not root-owned 0600
  # (an agent-readable key would let the agent bypass the broker), so the
  # daemon must be root to read them.
  broker:
    build:
      context: ../../..
      dockerfile: deploy/broker/Dockerfile
    image: openscope-broker:smoke
    user: "0:0"
    environment:
      - OPENSCOPE_CONFIG_DIR=/var/lib/openscope
      - OPENSCOPE_ADMIN_DIR=/etc/openscope
      # Keep the Unix socket off the bind-mounted volume — chmod on a socket on
      # the Docker Desktop virtiofs share fails. The smoke uses only HTTP.
      - OPENSCOPE_SOCKET=/run/openscoped.sock
      - OPENSCOPE_HTTP_LISTEN=:8443
      # TLS is terminated upstream (oauth2-proxy / LB); broker speaks plaintext
      # on the private network.
      - OPENSCOPE_HTTP_PLAINTEXT_OK=1
      # Honor a trusted-proxy token's forwarded user header.
      - OPENSCOPE_HTTP_TRUST_PROXY=1
      # Fixed pepper so the CLI `token mint` and the daemon agree (smoke only).
      - OPENSCOPE_AUTH_PEPPER=smoke-pepper-not-for-production
    volumes:
      - ./.smoke/admin:/etc/openscope
      - ./.smoke/state:/var/lib/openscope
      - ./.smoke/seed:/seed:ro
    networks: [ssonet]

  # --- Token injector: swaps the IdP JWT for the broker's proxy token -------
  # oauth2-proxy forwards the original IdP bearer upstream; the broker speaks
  # its own osk_* HMAC token scheme, so this hop replaces Authorization with
  # the minted trusted-proxy token and passes the verified email through.
  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./.smoke/nginx.conf:/etc/nginx/nginx.conf:ro
    networks: [ssonet]
    profiles: [proxy]

  # --- SSO reverse proxy (does the OIDC dance, IdP-agnostic) ----------------
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
    command:
      - --provider=oidc
      - --oidc-issuer-url=http://mock-oidc:8080/default
      # mock-oauth2-server puts the username in `sub`, not `email`.
      - --oidc-email-claim=sub
      - --client-id=oauth2-proxy
      - --client-secret=secret
      # Accept a valid IdP bearer JWT directly (no browser redirect) so the
      # chain is testable headlessly.
      - --skip-jwt-bearer-tokens=true
      - --upstream=http://nginx:80
      - --http-address=0.0.0.0:4180
      - --cookie-secret=0123456789abcdef0123456789abcdef
      - "--email-domain=*"
      - --redirect-url=http://localhost:4180/oauth2/callback
    ports:
      - "4180:4180"
    networks: [ssonet]
    profiles: [proxy]

networks:
  ssonet:
    name: openscope-sso-smoke-net
