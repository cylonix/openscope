entscope \\\n           --entitlements \"$ASAPPLE_ENT\" \\\n           --sign \"$EXPANDED_CODE_SIGN_IDENTITY\" \\\n           --force \\\n           \"$BIN_DIR/asapple\"\n  echo \"Signed with Hardened Runtime: ascope ascoped asapple (com.ezblock.agentscope)\"\nfi\n";
