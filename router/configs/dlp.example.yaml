# OpenScope DLP ruleset — the built-in rules expressed as YAML.
#
# Point the router at a file like this with OPENSCOPE_DLP_RULES_FILE.
#   mode: extend   — your rules are added to the built-ins (same id overrides)
#   mode: replace  — ONLY the rules in this file are active
#
# This file uses "replace" and lists the full built-in set, so it behaves
# identically to running with no rules file: edit from here to customize.
#
# Categories: content-class | classification | export-control | foundry-nda
#             | secret | pii
# Severities: critical | high | medium | low
# min_hits:   matches required before the rule fires (0/1 = any match)
#
# Generated by: go run ./internal/dlp/gen — do not edit the rule list by
# hand here without also updating patterns.go (or your own copy elsewhere).

version: 1
mode: replace
rules:
  - id: hdl-verilog
    name: 'Verilog / SystemVerilog source'
    category: content-class
    severity: high
    min_hits: 2
    pattern: '(?im)(\bendmodule\b|\balways_ff\b|\balways_comb\b|\balways_latch\b|\balways\s*@|\x60timescale\b|\binitial\s+begin\b|\breg\s*\[|\bwire\s*\[|\bassign\s+\w+\s*=|\bmodule\s+\w+\s*[#(;])'
  - id: hdl-vhdl
    name: 'VHDL source'
    category: content-class
    severity: high
    min_hits: 2
    pattern: '(?im)(\bentity\s+\w+\s+is\b|\barchitecture\s+\w+\s+of\b|\bport\s*\(|\bstd_logic(_vector)?\b|\bsignal\s+\w+\s*:|\bprocess\s*\()'
  - id: spice-netlist
    name: 'SPICE netlist / device model'
    category: content-class
    severity: high
    min_hits: 2
    pattern: '(?im)^\s*\.(subckt|ends|model|tran|ac|dc|op|param|include|lib|global|measure|probe|nodeset)\b'
  - id: liberty-netlist
    name: 'Liberty / gate-level netlist'
    category: content-class
    severity: high
    min_hits: 2
    pattern: '(?im)^\s*(library|cell|pin|timing|pg_pin|leakage_power|internal_power)\s*\('
  - id: sdc-constraints
    name: 'Synopsys design constraints (SDC)'
    category: content-class
    severity: high
    min_hits: 1
    pattern: '(?i)\b(create_clock|set_input_delay|set_output_delay|set_clock_uncertainty|set_clock_groups|set_false_path|set_multicycle_path|set_max_delay|set_propagated_clock|current_design)\b'
  - id: layout-lef-def-gds
    name: 'Physical layout (LEF/DEF/GDSII)'
    category: content-class
    severity: critical
    min_hits: 1
    pattern: '(?im)(^\s*DIEAREA\b|^\s*COMPONENTS\s+\d|^\s*MACRO\s+\w+|^\s*END\s+LIBRARY\b|\bGDSII\b|^\s*UNITS\s+DISTANCE\s+MICRONS\b)'
  - id: tapeout-stream
    name: 'Tapeout mask layout (GDSII/OASIS stream)'
    category: content-class
    severity: critical
    min_hits: 1
    pattern: '(?s)(\A\x00\x06\x00\x02|\A%SEMI-OASIS|%SEMI-OASIS\r?\n)'
  - id: classification-marker
    name: 'Confidentiality / classification marker'
    category: classification
    severity: high
    min_hits: 1
    pattern: '(?i)(COMPANY\s+CONFIDENTIAL|STRICTLY\s+CONFIDENTIAL|TRADE\s+SECRET|PROPRIETARY\s+AND\s+CONFIDENTIAL|INTERNAL\s+USE\s+ONLY|RESTRICTED\s+DISTRIBUTION|CONFIDENTIAL\s+DESIGN|NOT\s+FOR\s+EXTERNAL\s+(USE|DISTRIBUTION))'
  - id: export-control
    name: 'Export-control marker (ITAR/EAR/ECCN)'
    category: export-control
    severity: critical
    min_hits: 1
    pattern: '(?i)(\bITAR\b|\bEAR99\b|\bECCN\b|\bEXPORT[\s-]CONTROLLED\b|\b3A001\b|\bexport\s+administration\s+regulations\b)'
  - id: foundry-pdk
    name: 'Foundry / PDK identifier (NDA)'
    category: foundry-nda
    severity: high
    min_hits: 1
    pattern: '(?i)(\bTSMC\b|\bGlobalFoundries\b|\bSamsung\s+Foundry\b|\bSMIC\b|\bprocess\s+design\s+kit\b|\bPDK\b|\b[NT][0-9]{1,2}\s*(nm)?\s+(node|process|PDK)|\b(3|5|7|16|28)\s*nm\s+(node|process|PDK))'
  - id: aws-access-key
    name: 'AWS access key'
    category: secret
    severity: critical
    min_hits: 1
    pattern: '\bA(?:KIA|SIA|GPA|IDA|IPA|NPA|NVA|PKA|ROA|SCA|3T)[0-9A-Z]{16}\b'
  - id: private-key-block
    name: 'PEM private key block'
    category: secret
    severity: critical
    min_hits: 1
    pattern: '-----BEGIN (?:RSA |EC |DSA |OPENSSH |PGP )?PRIVATE KEY-----'
  - id: api-token
    name: 'API token / bearer secret'
    category: secret
    severity: high
    min_hits: 1
    pattern: '(?i)(ghp_[0-9A-Za-z]{36}|github_pat_[0-9A-Za-z_]{40,}|xox[baprs]-[0-9A-Za-z-]{10,}|sk-[A-Za-z0-9]{20,})'
  - id: encrypted-ip-pragma
    name: 'IEEE-1735 encrypted IP (licensed)'
    category: secret
    severity: high
    min_hits: 1
    pattern: '(?i)(\x60pragma\s+protect|-----BEGIN\s+PROTECTED-----|DATA_METHOD\s*=)'
  - id: us-ssn
    name: 'US Social Security Number'
    category: pii
    severity: medium
    min_hits: 1
    pattern: '\b\d{3}-\d{2}-\d{4}\b'
  - id: credit-card-like
    name: 'Credit card-like number'
    category: pii
    severity: medium
    min_hits: 1
    pattern: '\b(?:\d{4}[- ]?){3}\d{1,4}\b'
